  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink: #14110d; } }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      var(--foto) center / cover no-repeat,
      radial-gradient(60% 70% at 25% 55%, #8a8176 0%, transparent 60%),
      linear-gradient(180deg, var(--bg3), var(--bg1) 45%, var(--bg2));
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    color: var(--ink); overflow: hidden; -webkit-tap-highlight-color: transparent;
  }
  .veil { position: fixed; inset: 0; background: rgba(246,242,230,.52); backdrop-filter: blur(2px); }
  main {
    position: relative; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 44px; padding: 24px; pointer-events: none;
  }
  h1 {
    margin: 0; text-align: center; font-weight: 400;
    font-family: "Pinyon Script", "Brush Script MT", cursive;
    font-size: clamp(40px, 8vw, 104px); line-height: 1.1;
  }
  .row { width: min(700px, 92vw); height: clamp(60px, 9vw, 78px); }
  button {
    position: fixed; left: 0; top: 0; z-index: 5;
    width: min(330px, 44vw); height: clamp(60px, 9vw, 78px);
    border: 0; border-radius: 999px; cursor: pointer; padding: 0 8px;
    font: 600 clamp(14px, 2.2vw, 24px) "Cormorant Garamond", Georgia, serif;
    color: var(--ink); letter-spacing: .02em; text-transform: uppercase; white-space: nowrap;
    box-shadow: inset 0 5px 8px rgba(255,255,255,.75), inset 0 -7px 10px rgba(0,0,0,.18), 0 6px 14px rgba(0,0,0,.25);
    touch-action: manipulation;
  }
  button:active { transform: scale(.97); }
  #si { background: linear-gradient(180deg, var(--no1), var(--no2)); }
  #no { background: linear-gradient(180deg, var(--yes1), var(--yes2)); z-index: 6; }
  #msg {
    position: fixed; left: 0; right: 0; bottom: calc(5vh + env(safe-area-inset-bottom, 0px));
    margin: 0; font-size: clamp(18px, 3vw, 26px); font-style: italic; text-align: center;
    min-height: 1.4em; padding: 0 20px; pointer-events: none;
  }
  #modal {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; padding: 24px;
    background: rgba(20, 17, 13, .38); backdrop-filter: blur(3px);
  }
  #modal.show { display: flex; }
  .card {
    width: min(520px, 92vw); text-align: center; padding: 40px 28px 30px;
    background: rgba(250, 247, 238, .97); border-radius: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35), inset 0 4px 8px rgba(255,255,255,.8);
  }
  .card p {
    margin: 0 0 26px; font-family: "Pinyon Script", "Brush Script MT", cursive;
    font-size: clamp(32px, 7vw, 52px); line-height: 1.2; color: var(--ink);
  }
  #modal .cerrar {
    position: static; z-index: auto; width: auto; height: 48px; padding: 0 30px;
    background: linear-gradient(180deg, var(--yes1), var(--yes2)); font-size: 18px;
  }
  .credito {
    position: fixed; right: 16px; bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    margin: 0; font-size: 15px; font-style: italic; letter-spacing: .04em;
    color: var(--ink); opacity: .7; pointer-events: none; z-index: 1;
  }
</style>
</head>

  var ptr = { x: innerWidth / 2, y: innerHeight / 2 };
  var np = { x: 0, y: 0 };

  function setT(el, x, y) { el.style.translate = x + 'px ' + y + 'px'; el._x = x; el._y = y; }

  function layout() {
    if (!active) {
      var r = row.getBoundingClientRect();
      setT(si, r.left, r.top);
      setT(no, r.right - no.offsetWidth, r.top);
      np.x = no._x; np.y = no._y;
    } else {
      var x = Math.min(Math.max(8, si._x), innerWidth - si.offsetWidth - 8);
      var y = Math.min(Math.max(8, si._y), innerHeight - si.offsetHeight - 8);
      setT(si, x, y);
    }
  }
  layout();
  addEventListener('resize', layout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

  // El botón NO sigue al cursor
  (function tick() {
    if (active) {
      np.x += (ptr.x - no.offsetWidth / 2 - np.x) * 0.55;
      np.y += (ptr.y - no.offsetHeight / 2 - np.y) * 0.55;
      setT(no, np.x, np.y);
    }
    requestAnimationFrame(tick);
  })();

  function rnd(n, not) { var i; do { i = Math.floor(Math.random() * n); } while (n > 1 && i === not); return i; }

  function pickSpot() {
    var w = si.offsetWidth, h = si.offsetHeight, m = 12;
    var topM = m + (parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0);
    var minD = Math.min(380, Math.min(innerWidth, innerHeight) * 0.5);
    var t = h1.getBoundingClientRect(), best = null, bestD = -1;
    for (var k = 0; k < 60; k++) {
      var x = m + Math.random() * Math.max(1, innerWidth - w - 2 * m);
      var y = topM + Math.random() * Math.max(1, innerHeight - h - topM - m - 40);
      var d = Math.hypot(x + w / 2 - ptr.x, y + h / 2 - ptr.y);
      var onTitle = x < t.right + 8 && x + w > t.left - 8 && y < t.bottom + 8 && y + h > t.top - 8;
      var score = d - (onTitle ? 5000 : 0);
      if (score > bestD) { bestD = score; best = { x: x, y: y }; }
      if (d >= minD && !onTitle) return { x: x, y: y };
    }
    return best;
  }

  var isOpen = false;
  function dodge() {
    if (isOpen) return;
    var now = Date.now();
    if (now - last < 30) return;
    last = now; active = true; count++;
    var s = pickSpot();
    setT(si, s.x, s.y);
    // el botón de "no" aparece justo bajo el cursor
    np.x = ptr.x - no.offsetWidth / 2; np.y = ptr.y - no.offsetHeight / 2;
    setT(no, np.x, np.y);
    prevN = rnd(noTextos.length, prevN);
    no.textContent = noTextos[prevN];
    if (count % 3 === 0) msg.textContent = burlas[rnd(burlas.length, -1)];
  }

  function near(r, x, y, pad) {
    return x > r.left - pad && x < r.right + pad && y > r.top - pad && y < r.bottom + pad;
  }

  document.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'touch') return;
    ptr.x = e.clientX; ptr.y = e.clientY;
    if (near(si.getBoundingClientRect(), ptr.x, ptr.y, 70)) dodge();
  });

  ['pointerdown', 'mousedown', 'touchstart', 'click', 'focus'].forEach(function (ev) {
    si.addEventListener(ev, function (e) {
      var p = (e.touches && e.touches[0]) || e;
      if (typeof p.clientX === 'number') { ptr.x = p.clientX; ptr.y = p.clientY; }
      if (e.cancelable) e.preventDefault();
      last = 0; dodge(); si.blur();
    }, { passive: false });
  });

  var modal = document.getElementById('modal');
  function closeModal() { isOpen = false; modal.classList.remove('show'); }
  no.addEventListener('click', function () {
    isOpen = true;
    modal.classList.add('show');
  });
  document.getElementById('cerrar').addEventListener('click', closeModal);
  modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
})();
</script>
</body>
